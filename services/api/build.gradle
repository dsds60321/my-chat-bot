plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
}

group = 'com.mychatbot'
version = '0.1.0-SNAPSHOT'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.5.16')
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.apache.lucene:lucene-core:10.6.0'
    implementation 'org.apache.lucene:lucene-analysis-common:10.6.0'
    implementation 'org.apache.lucene:lucene-analysis-nori:10.6.0'
    implementation 'org.apache.poi:poi-ooxml:6.0.0'
    implementation 'org.apache.tika:tika-core:3.3.3'
    implementation 'org.apache.tika:tika-parsers-standard-package:3.3.3'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

// Private overrides belong under .secret, outside the application resources.
tasks.named('processResources') {
    exclude('.secret/**', 'application-local.yml', 'application-local.yaml', 'application-local.properties')
}
